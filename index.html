<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find scholarships you qualify for. Build your profile once, apply to every scheme that fits." />
    <title>Scholarships for students with disabilities</title>

    <!-- Launcher icons. Every file here is generated by scripts/build-icons.py
         from ../logo.png; do not hand-edit them.

         The .ico is listed even though the PNGs cover every modern browser: a
         request for /favicon.ico is made regardless of what is declared, and an
         undeclared one is a 404 in the log of every page load. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The colour the browser paints its own chrome, and the one behind the
         page before any CSS has arrived. Both are the icon's ground rather than
         the app's surface, so that the launch of an installed app shows the
         mark on the field it was drawn for; it matches manifest.webmanifest,
         and the two have to be changed together. -->
    <meta name="theme-color" content="#0b0e14" />
  </head>
  <body>
    <div id="root">
      <!-- Replaced on mount. Present so that a slow connection on a low-end
           handset shows something other than a white screen, and so a reader
           that never runs the script is still told what this page is. -->
      <noscript>
        <main style="font: 400 18px/1.6 system-ui, sans-serif; max-width: 38rem; margin: 3rem auto; padding: 0 1rem;">
          <h1>Scholarships for students with disabilities</h1>
          <p>
            This page needs JavaScript to search and apply. If you cannot use it,
            call the helpline on the printed notice from your college or
            district disability office, and they can search on your behalf.
          </p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
