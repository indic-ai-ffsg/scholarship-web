<!doctype html>
<html lang="en">
  <head>
    <!-- google-tag -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title and the link-preview tags, per address.

         WhatsApp, Gmail, LinkedIn and the rest build a link's preview from this
         file as the server sends it. They do not run JavaScript, so in a
         single-page app every address previews as the home page — which, for
         /scholarships/<slug>, is the one link people forward most.

         So nginx fills the head in as it serves the page: for a scheme's own
         address it includes that scheme's tags from the API, and for every
         other address ($share_slug empty) the site's own. Real readers get the same file
         as crawlers — there is no bot sniffing and no redirect, so the link
         somebody shares is the page they land on. See nginx.conf.template.

         Both come from the API, the site's own included, because a preview's
         og:image has to be an absolute address and only the API is told the
         site's public origin (PUBLIC_SITE_URL). If the API cannot answer, nginx
         falls back to public/share-head-default.html.

         The lines that look like comments are nginx SSI directives. Under
         `npm run dev` nothing reads them and the page has no static title until
         the app sets one — Layout always does, so this costs nothing there. -->
    <!--# include virtual="/__share-head/$share_slug" -->

    <!-- Launcher icons. Every file here is generated by scripts/build-icons.py
         from ../logo.png; do not hand-edit them.

         The .ico is listed even though the PNGs cover every modern browser: a
         request for /favicon.ico is made regardless of what is declared, and an
         undeclared one is a 404 in the log of every page load. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The colour the browser paints its own chrome, and the one behind the
         page before any CSS has arrived. Both are the icon's ground rather than
         the app's surface, so that the launch of an installed app shows the
         mark on the field it was drawn for; it matches manifest.webmanifest,
         and the two have to be changed together. -->
    <meta name="theme-color" content="#0b0e14" />

    <!-- Written by the container at start-up from its own environment, and
         loaded before the bundle so window.__ENV__ exists by the time any of it
         runs. Classic (non-module) and undeferred on purpose: module scripts are
         deferred, so this is guaranteed to have executed first.

         It is a real file in public/ as well, holding an empty object, so that
         `npm run dev` does not 404 here and falls through to .env instead. See
         src/lib/runtime-config.ts. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced on mount. Present so that a slow connection on a low-end
           handset shows something other than a white screen, and so a reader
           that never runs the script is still told what this page is. -->
      <noscript>
        <main style="font: 400 18px/1.6 system-ui, sans-serif; max-width: 38rem; margin: 3rem auto; padding: 0 1rem;">
          <h1>Scholarships for students with disabilities</h1>
          <p>
            This page needs JavaScript to search and apply. If you cannot use it,
            call the helpline on the printed notice from your college or
            district disability office, and they can search on your behalf.
          </p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
